type: custom:dd-entity-card

entity: input_number.nastavena_teplota_bojlera

icon: mdi:water-boiler

name:
  value: Bojler

secondary:
  rows:
    - row:
        - text: "Teplota: "
        - entity: sensor.teplota_bojler
          state: true
          unit: true
          color: green

    - row:
        - text: "Spotreba: "
        - entity: sensor.sonoff_meranie_spotreby_power
          state: true
          unit: true
          color: orange

    - row:
        - text: "Dnes: "
        - entity: sensor.energia_denne_bojler
          state: true
          unit: true

value:
  decimals: 1
  unit: true

controls:
  - type: number
    step: 0.5

  - type: switch
    entity: switch.zapinanie_bojlera
